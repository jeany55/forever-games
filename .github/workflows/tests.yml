name: 🛡️ Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y lua5.1

      - name: Run tests
        run: ./Tests/RunTests.sh

      # Make sure the addon still packages, and keep the zip around for trying a branch out
      - name: Build zip
        run: ./build.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ForeverGames
          path: .release/*.zip
          # The zip is in a dot folder, which is skipped by default
          include-hidden-files: true
